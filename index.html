<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAPHIEL IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #05070d;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 18px 0;
    }

    header h1 {
      margin: 0;
      letter-spacing: 5px;
      font-size: 28px;
    }

    .status {
      margin-top: 8px;
      color: #7ee7ff;
      font-size: 14px;
    }

    /* NÚCLEO DA RAPHIEL */

    #raphael {
      width: 150px;
      height: 150px;
      margin: 20px auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle1 {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 2px solid #38d9ff;
      border-radius: 50%;
      box-shadow:
        0 0 15px #38d9ff,
        0 0 40px rgba(56, 217, 255, 0.35);
      animation: rotate 4s linear infinite;
    }

    .circle2 {
      position: absolute;
      width: 105px;
      height: 105px;
      border: 2px solid #8b7cff;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(139, 124, 255, 0.5);
      animation: reverseRotate 3s linear infinite;
    }

    .core {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 15px white,
        0 0 35px #38d9ff,
        0 0 60px rgba(56, 217, 255, 0.7);
      animation: pulse 1.5s infinite;
      z-index: 2;
    }

    #raphael.speaking .core {
      animation: pulse 0.45s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes reverseRotate {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    /* CHAT */

    #chat {
      flex: 1;
      min-height: 300px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 15px;
      border: 1px solid #1b2d3a;
      border-radius: 15px;
      background: #080c14;
    }

    .message {
      margin: 10px 0;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .bot {
      background: #101a24;
      border-left: 3px solid #38d9ff;
    }

    .user {
      background: #17202b;
      border-right: 3px solid #8b7cff;
      text-align: right;
    }

    /* CONTROLES */

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    #message {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #29404d;
      border-radius: 12px;
      outline: none;
      background: #0b1018;
      color: white;
      font-size: 16px;
    }

    #message:focus {
      border-color: #38d9ff;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      background: #38d9ff;
      color: #001018;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #voiceButton {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      background: #17202b;
      color: white;
      border: 1px solid #29404d;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      color: #687987;
      font-size: 12px;
      padding-bottom: 8px;
    }

    @media (max-width: 500px) {
      .app {
        padding: 12px;
      }

      header h1 {
        font-size: 23px;
      }

      .controls {
        flex-direction: column;
      }

      #sendButton {
        min-height: 48px;
      }

      #raphael {
        margin: 15px auto;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <h1>RAPHIEL IA</h1>

      <div class="status" id="status">
        Sistema de análise pronto
      </div>
    </header>


    <!-- NÚCLEO -->

    <div id="raphael">

      <div class="circle1"></div>
      <div class="circle2"></div>
      <div class="core"></div>

    </div>


    <!-- CHAT -->

    <section id="chat">

      <div class="message bot">
        Olá. Eu sou Raphiel. Como posso ajudar?
      </div>

    </section>


    <!-- CAMPO DE MENSAGEM -->

    <div class="controls">

      <input
        id="message"
        type="text"
        placeholder="Digite sua pergunta..."
        autocomplete="off"
      >

      <button id="sendButton">
        Enviar
      </button>

    </div>


    <!-- VOZ -->

    <button id="voiceButton">
      🔊 Testar voz
    </button>


    <div class="footer">
      Raphiel IA • Sistema online
    </div>

  </main>


  <script>

    /*
      SEU CLOUDFLARE WORKER
    */

    const API_URL =
      "https://raphiel-ia.luiz2027rocha.workers.dev";


    const chat =
      document.getElementById("chat");

    const messageInput =
      document.getElementById("message");

    const sendButton =
      document.getElementById("sendButton");

    const voiceButton =
      document.getElementById("voiceButton");

    const status =
      document.getElementById("status");

    const raphael =
      document.getElementById("raphael");


    /*
      ADICIONAR MENSAGEM
    */

    function addMessage(text, type) {

      const div =
        document.createElement("div");

      div.className =
        "message " + type;

      div.textContent = text;

      chat.appendChild(div);

      chat.scrollTop =
        chat.scrollHeight;

      return div;
    }


    /*
      FALAR
    */

    function speak(text) {

      if (!("speechSynthesis" in window)) {
        return;
      }

      speechSynthesis.cancel();

      const voice =
        new SpeechSynthesisUtterance(text);

      voice.lang = "pt-BR";
      voice.rate = 1;
      voice.pitch = 1;

      voice.onstart = function() {
        raphael.classList.add("speaking");
      };

      voice.onend = function() {
        raphael.classList.remove("speaking");
      };

      voice.onerror = function() {
        raphael.classList.remove("speaking");
      };

      speechSynthesis.speak(voice);
    }


    /*
      TESTAR VOZ
    */

    voiceButton.addEventListener(
      "click",
      function() {

        speak(
          "Olá. Eu sou Raphiel. Sistema de voz funcionando."
        );

      }
    );


    /*
      ENVIAR MENSAGEM
    */

    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text) {
        return;
      }


      addMessage(text, "user");

      messageInput.value = "";

      sendButton.disabled = true;

      sendButton.textContent =
        "Pensando...";

      status.textContent =
        "Processando...";


      const loading =
        addMessage(
          "Raphiel está processando...",
          "bot"
        );


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: text
            })

          });


        const rawText =
          await response.text();


        let data = null;


        try {

          data =
            JSON.parse(rawText);

        } catch {

          data = null;

        }


        if (!response.ok) {

          const serverError =
            data?.reply ||
            data?.error ||
            "Erro HTTP " + response.status;

          throw new Error(serverError);

        }


        let reply = "";


        if (
          data &&
          typeof data.reply === "string"
        ) {

          reply =
            data.reply.trim();

        }


        if (!reply) {

          reply =
            "O servidor não enviou uma resposta.";

        }


        loading.textContent =
          reply;

        status.textContent =
          "Sistema online";


        speak(reply);


      } catch (error) {

        console.error(
          "Erro da Raphiel:",
          error
        );


        loading.textContent =
          "Erro ao conectar com a inteligência artificial.\n\n" +
          error.message;


        status.textContent =
          "Erro no servidor";

      }


      sendButton.disabled = false;

      sendButton.textContent =
        "Enviar";

      messageInput.focus();

    }


    /*
      BOTÃO ENVIAR
    */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /*
      ENTER
    */

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
