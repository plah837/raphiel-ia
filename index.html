<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raphael Tensura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="home-btn" aria-label="Home">
          <span>⌂</span>
        </div>

        <div class="address-bar">
          <span class="lock">◌</span>
          <span>plah837.github.io/raphi</span>
        </div>

        <div class="menu-btn">⋮</div>
      </header>

      <main class="content">
        <h1 class="title">RAPHAEL TENSURA</h1>
        <p class="subtitle">Sistema de análise pronto</p>

        <div class="orb-wrap">
          <div class="orb-ring outer"></div>
          <div class="orb-ring inner"></div>
          <div class="orb-core"></div>
        </div>

        <div class="bubble assistant-bubble">
          <p id="assistantText">Olá! Eu sou Raphael Tensura. Como posso ajudar?</p>
        </div>

        <div class="input-panel">
          <div class="input-row">
            <input
              id="messageInput"
              type="text"
              placeholder="Digite sua pergunta..."
              aria-label="Digite sua pergunta"
            />

            <button id="voiceBtn" class="icon-btn voice-btn" aria-label="Ativar microfone">
              ◉
            </button>

            <button id="sendBtn" class="send-btn" aria-label="Enviar">
              ▸
            </button>
          </div>

          <div class="controls">
            <button id="microBtn" class="micro-btn" aria-label="Microfone">
              ◍
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
  </html>
