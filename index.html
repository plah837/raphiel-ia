<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAPHAEL TENSEI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #17102d 0%, #090711 45%, #030307 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    /* ESFERA */
    .sphere {
      width: 190px;
      height: 190px;
      margin: 0 auto 28px;
      border-radius: 50%;
      position: relative;

      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          #ffffff 7%,
          #c8b8ff 13%,
          #8c5cff 25%,
          #4d19b8 43%,
          #17063e 67%,
          transparent 70%
        );

      box-shadow:
        0 0 15px #ffffff,
        0 0 35px #a96cff,
        0 0 70px #643cff,
        0 0 110px #1d8cff;

      animation: pulse 3s ease-in-out infinite;
    }

    .sphere::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 5px solid #00d9ff;

      box-shadow:
        0 0 10px #00d9ff,
        0 0 25px #008cff,
        inset 0 0 20px #00d9ff;

      opacity: 0.95;
    }

    .sphere::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 3px solid #b86cff;

      box-shadow:
        0 0 15px #b86cff,
        inset 0 0 18px #8c42ff;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 5px;
      font-weight: 700;
      text-shadow:
        0 0 10px #ffffff,
        0 0 25px #9b5cff;
    }

    .subtitle {
      margin: 10px 0 25px;
      color: #b9b1d0;
      font-size: 15px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(0, 255, 180, 0.08);
      border: 1px solid rgba(0, 255, 180, 0.3);
      color: #70ffc
